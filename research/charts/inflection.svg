<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="US furniture stores fell from 23,513 in 2013 to 21,964 in 2023 across the cloud point-of-sale, online and AI eras. At today the line forks: path A, adopt AI and run on numbers; path B, exit, where 92% of small-business exits are closures.">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .s{font-family:Georgia,"Times New Roman",serif}
    .f{opacity:0;animation:fade .6s ease forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:2.4s}.d3{animation-delay:3.8s}.d4{animation-delay:5.4s}.d5{animation-delay:6.6s}.d6{animation-delay:9.2s}.d7{animation-delay:10.6s}.d8{animation-delay:12.2s}
    .main{stroke-dasharray:720;stroke-dashoffset:720;animation:draw 3s cubic-bezier(.3,0,.2,1) 2.4s forwards}
    .pa,.pb{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.6s cubic-bezier(.3,0,.2,1) 9.2s forwards}
    .pulse{transform-origin:1000px 440px;animation:pulse 1.6s ease-out 7s infinite}
    @keyframes fade{to{opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    @media (prefers-reduced-motion:reduce){.f{opacity:1;animation:none}.main,.pa,.pb{stroke-dashoffset:0;animation:none}.pulse{animation:none;opacity:0}}
  </style>
  <rect width="1280" height="720" fill="#FAF8F4"/>
  <g class="f d1">
    <path d="M140 540H1180" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="t" x="140" y="90" font-size="13" fill="#64748B">US furniture stores</text>
    <rect x="140" y="556" width="300" height="70" fill="#EFE9DF"/>
    <rect x="440" y="556" width="450" height="70" fill="#EFE9DF" opacity=".65"/>
    <rect x="890" y="556" width="290" height="70" fill="#EFE9DF" opacity=".4"/>
    <text class="s" x="290" y="586" text-anchor="middle" font-size="19" fill="#0F172A">Internet</text>
    <text class="t" x="290" y="609" text-anchor="middle" font-size="12.5" fill="#64748B">a website and a listing</text>
    <text class="s" x="665" y="586" text-anchor="middle" font-size="19" fill="#0F172A">Cloud</text>
    <text class="t" x="665" y="609" text-anchor="middle" font-size="12.5" fill="#64748B">Square 2010 · Shopify POS 2013</text>
    <text class="s" x="1035" y="586" text-anchor="middle" font-size="19" fill="#0F172A">AI</text>
    <text class="t" x="1035" y="609" text-anchor="middle" font-size="12.5" fill="#64748B">from Nov 2022</text>
    <g class="t" font-size="13" fill="#64748B" text-anchor="middle">
      <text x="160" y="660">2013</text><text x="440" y="660">2019</text><text x="820" y="660">2023</text><text x="1000" y="660" fill="#0F172A" font-weight="600">today</text>
    </g>
  </g>
  <path class="main" d="M160 300 L253 298 L440 352 L820 428" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="f d2"><circle cx="160" cy="300" r="5" fill="#0F172A"/><text class="t" x="160" y="278" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="600">23,513</text></g>
  <g class="f d3"><circle cx="440" cy="352" r="5" fill="#0F172A"/><text class="t" x="440" y="330" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="600">22,900</text></g>
  <g class="f d4"><circle cx="820" cy="428" r="5" fill="#0F172A"/><text class="t" x="820" y="406" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="600">21,964</text><text class="t" x="820" y="470" text-anchor="middle" font-size="13" fill="#334155">1 in 15 gone in ten years</text><path d="M820 428 L1000 440" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 8"/></g>
  <g class="f d5">
    <circle class="pulse" cx="1000" cy="440" r="9" fill="none" stroke="#5B3A24" stroke-width="2"/>
    <circle cx="1000" cy="440" r="7" fill="#5B3A24"/>
    <text class="t" x="1000" y="498" text-anchor="middle" font-size="14" fill="#334155">over half of owners are 55 or older</text>
  </g>
  <path class="pa" d="M1000 440 C 1060 420, 1110 330, 1160 230" fill="none" stroke="#1E7F5C" stroke-width="4" stroke-linecap="round"/>
  <path class="pb" d="M1000 440 C 1060 456, 1110 500, 1160 536" fill="none" stroke="#B42318" stroke-width="4" stroke-linecap="round"/>
  <g class="f d6">
    <circle cx="1180" cy="206" r="15" fill="#1E7F5C"/><text class="t" x="1180" y="211" text-anchor="middle" font-size="15" fill="#FAF8F4" font-weight="700">A</text>
    <circle cx="1180" cy="548" r="15" fill="#B42318"/><text class="t" x="1180" y="553" text-anchor="middle" font-size="15" fill="#FAF8F4" font-weight="700">B</text>
  </g>
  <g class="f d7">
    <text class="s" x="1160" y="160" text-anchor="end" font-size="20" fill="#1E7F5C">Adopt AI and run on numbers</text>
    <text class="t" x="1160" y="184" text-anchor="end" font-size="13" fill="#334155">of small businesses using AI, 43% report revenue up, 2% down</text>
    <text class="s" x="1160" y="596" text-anchor="end" font-size="20" fill="#B42318">Exit</text>
    <text class="t" x="1160" y="620" text-anchor="end" font-size="13" fill="#334155">when a small business exits, 92% close, 5% are sold</text>
  </g>
  <g class="f d8"><text class="s" x="640" y="56" text-anchor="middle" font-size="26" fill="#0F172A">Floorline is path A for the independent furniture store.</text></g>
  <text class="t" x="140" y="704" font-size="11" fill="#94A3B8">Sources: Census County Business Patterns 2013, 2019, 2023 (NAICS 442110); Census e-commerce via FRED; US Chamber/Teneo 2025; Census ABS 2022; Intuit AI Impact Report 2026; McKinsey, The Great Ownership Transfer, 2026.</text>
</svg>
